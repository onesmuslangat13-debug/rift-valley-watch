name: Rift Valley Watch - Generate Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # FFMPEG
      # ============================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install feedparser
          pip install beautifulsoup4
          pip install gTTS
          pip install Pillow
          pip install moviepy
          pip install numpy

      # ============================================================
      # CLEAN OLD OUTPUT
      # ============================================================

      - name: Clean previous generated files
        run: |
          echo "============================================================"
          echo "CLEANING PREVIOUS GENERATED FILES"
          echo "============================================================"

          rm -f output/rift_valley_watch_reel.mp4
          rm -f audio/narration.mp3
          rm -f assets/source/story_image.jpg
          rm -f data/selected_story.json
          rm -f data/selected_script.json

          mkdir -p output
          mkdir -p audio
          mkdir -p assets/source
          mkdir -p data

      # ============================================================
      # GENERATE STORY + NARRATION + VIDEO
      # ============================================================

      - name: Generate Rift Valley Watch video
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "============================================================"
          echo "STARTING RIFT VALLEY WATCH"
          echo "============================================================"

          python -u rift_valley_main.py

      # ============================================================
      # VERIFY NARRATION
      # ============================================================

      - name: Verify narration
        run: |
          echo "============================================================"
          echo "VERIFYING NARRATION"
          echo "============================================================"

          if [ ! -f "audio/narration.mp3" ]; then
            echo ""
            echo "**Error:** Narration MP3 was not generated."
            echo ""
            echo "Available audio files:"
            find . -type f \( -name "*.mp3" -o -name "*.wav" -o -name "*.m4a" \) -print || true
            exit 1
          fi

          SIZE=$(stat -c%s "audio/narration.mp3")

          echo "Narration file: audio/narration.mp3"
          echo "Narration size: ${SIZE} bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo ""
            echo "**Error:** Narration MP3 is too small."
            exit 1
          fi

          echo ""
          echo "NARRATION VERIFIED"

      # ============================================================
      # VERIFY STORY IMAGE
      # ============================================================

      - name: Verify story image
        run: |
          echo "============================================================"
          echo "VERIFYING STORY IMAGE"
          echo "============================================================"

          if [ ! -f "assets/source/story_image.jpg" ]; then
            echo ""
            echo "**Error:** Story image was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "assets/source/story_image.jpg")

          echo "Story image: assets/source/story_image.jpg"
          echo "Image size: ${SIZE} bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo ""
            echo "**Error:** Story image is too small."
            exit 1
          fi

          echo ""
          echo "STORY IMAGE VERIFIED"

      # ============================================================
      # VERIFY FINAL MP4
      # ============================================================

      - name: Verify final MP4
        run: |
          echo "============================================================"
          echo "VERIFYING FINAL MP4"
          echo "============================================================"

          FILE="output/rift_valley_watch_reel.mp4"

          if [ ! -f "$FILE" ]; then
            echo ""
            echo "**Error:** Rift Valley Watch MP4 was NOT generated."
            echo ""
            echo "Available MP4 files:"
            find . -type f -name "*.mp4" -print || true
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")

          echo "Final MP4: $FILE"
          echo "File size: ${SIZE} bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo ""
            echo "**Error:** Final MP4 is too small."
            exit 1
          fi

          echo ""
          echo "VIDEO INFORMATION"
          echo "------------------------------------------------------------"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "$FILE"

          echo ""
          echo "FINAL MP4 VERIFIED"

      # ============================================================
      # FINAL OUTPUT SUMMARY
      # ============================================================

      - name: Show generated files
        run: |
          echo "============================================================"
          echo "GENERATED RIFT VALLEY WATCH FILES"
          echo "============================================================"

          echo ""
          echo "MP4:"
          ls -lh output/rift_valley_watch_reel.mp4

          echo ""
          echo "NARRATION:"
          ls -lh audio/narration.mp3

          echo ""
          echo "IMAGE:"
          ls -lh assets/source/story_image.jpg

          echo ""
          echo "STORY:"
          ls -lh data/selected_story.json

          echo ""
          echo "SCRIPT:"
          ls -lh data/selected_script.json

          echo ""
          echo "============================================================"
          echo "RIFT VALLEY WATCH GENERATION SUCCESSFUL"
          echo "============================================================"

      # ============================================================
      # COMMIT GENERATED MP4
      # ============================================================

      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/rift_valley_watch_reel.mp4

          if git diff --cached --quiet; then
            echo "No MP4 changes to commit."
          else
            git commit -m "Generate Rift Valley Watch daily reel"
            git push
          fi
