name: Rift Valley Watch - Generate Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # FFMPEG
      # ==========================================================

      - name: Install FFmpeg
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1


      # ==========================================================
      # PYTHON PACKAGES
      # ==========================================================

      - name: Install Python packages
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            requests \
            Pillow \
            gTTS

          echo ""
          echo "Installed packages:"
          python -m pip show requests Pillow gTTS


      # ==========================================================
      # DIRECTORY PREPARATION
      # ==========================================================

      - name: Prepare directories
        run: |
          set -e

          mkdir -p data
          mkdir -p audio
          mkdir -p assets/source
          mkdir -p assets/video_work
          mkdir -p output

          echo "Repository:"
          pwd

          echo ""
          echo "Directories:"
          find . -maxdepth 2 -type d | sort


      # ==========================================================
      # CLEAN PREVIOUS GENERATED FILES
      # ==========================================================

      - name: Clean generated files
        run: |
          set -e

          echo "============================================================"
          echo "CLEANING PREVIOUS GENERATED FILES"
          echo "============================================================"

          rm -f output/rift_valley_watch_reel.mp4

          rm -f audio/narration.mp3
          rm -f audio/narration_temp.mp3
          rm -f audio/gtts_test.mp3

          rm -f assets/video_work/narration.mp3

          find assets/source -maxdepth 1 -type f \
            \( \
              -name 'story_*_image.*' \
              -o -name 'story_image.*' \
            \) \
            -delete

          rm -f data/story.json
          rm -f data/script.json
          rm -f data/selected_story.json
          rm -f data/selected_script.json

          mkdir -p data
          mkdir -p audio
          mkdir -p assets/source
          mkdir -p assets/video_work
          mkdir -p output

          echo ""
          echo "CLEANUP COMPLETE"


      # ==========================================================
      # VERIFY REQUIRED FILES
      # ==========================================================

      - name: Verify repository files
        run: |
          set -e

          echo "============================================================"
          echo "VERIFYING REQUIRED REPOSITORY FILES"
          echo "============================================================"

          if [ ! -f rift_valley_main.py ]; then
            echo "ERROR: rift_valley_main.py is missing."
            exit 1
          fi

          if [ ! -f rift_valley_video_generator.py ]; then
            echo "ERROR: rift_valley_video_generator.py is missing."
            exit 1
          fi

          echo ""
          echo "Main:"
          ls -lh rift_valley_main.py

          echo ""
          echo "Renderer:"
          ls -lh rift_valley_video_generator.py

          echo ""
          echo "Required repository files found."


      # ==========================================================
      # VERIFY RENDERER
      # ==========================================================

      - name: Inspect renderer
        run: |
          set -e

          echo "============================================================"
          echo "INSPECTING RIFT VALLEY WATCH RENDERER"
          echo "============================================================"

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Renderer line count:"
          wc -l rift_valley_video_generator.py

          echo ""
          echo "Renderer header:"
          sed -n '1,25p' rift_valley_video_generator.py

          echo ""
          echo "Renderer ending:"
          tail -n 25 rift_valley_video_generator.py

          echo ""
          echo "Checking for old broken renderer signature..."

          if grep -n "y_top = (" rift_valley_video_generator.py; then
            echo ""
            echo "============================================================"
            echo "FATAL ERROR"
            echo "============================================================"
            echo "OLD BROKEN RENDERER DETECTED."
            exit 1
          fi

          echo ""
          echo "Old broken renderer signature not found."

          echo ""
          echo "Checking for obsolete fixed-five-scene renderer..."

          if grep -n "SCENE_COUNT = 5" rift_valley_video_generator.py; then
            echo ""
            echo "============================================================"
            echo "FATAL ERROR"
            echo "============================================================"
            echo "OLD FIXED-FIVE-SCENE RENDERER DETECTED."
            echo "This renderer can falsely repeat one image."
            exit 1
          fi

          echo ""
          echo "Obsolete fixed-five-scene renderer not found."

          echo ""
          echo "Renderer inspection passed."


      # ==========================================================
      # PYTHON SYNTAX
      # ==========================================================

      - name: Check Python syntax
        run: |
          set -e

          echo "============================================================"
          echo "CHECKING PYTHON SYNTAX"
          echo "============================================================"

          python -m py_compile rift_valley_main.py

          python -m py_compile rift_valley_video_generator.py

          echo ""
          echo "============================================================"
          echo "PYTHON SYNTAX CHECK PASSED"
          echo "============================================================"


      # ==========================================================
      # TEST GTTS
      # ==========================================================

      - name: Test gTTS
        run: |
          set -e

          echo "============================================================"
          echo "TESTING GTTS"
          echo "============================================================"

          python - <<'PY'
          from pathlib import Path
          from gtts import gTTS

          output = Path("audio/gtts_test.mp3")

          tts = gTTS(
              text="Rift Valley Watch narration test.",
              lang="en",
              slow=False
          )

          tts.save(str(output))

          if not output.exists():
              raise RuntimeError("gTTS test failed.")

          if output.stat().st_size < 1000:
              raise RuntimeError("gTTS output is too small.")

          print("gTTS TEST SUCCESSFUL")
          print("File:", output)
          print("Size:", output.stat().st_size)
          PY

          rm -f audio/gtts_test.mp3


      # ==========================================================
      # RUN MAIN APPLICATION
      # ==========================================================

      - name: Run Rift Valley Watch main engine
        run: |
          set -e

          echo "============================================================"
          echo "STARTING RIFT VALLEY WATCH"
          echo "============================================================"

          python -u rift_valley_main.py

          echo ""
          echo "============================================================"
          echo "RIFT VALLEY WATCH MAIN ENGINE FINISHED"
          echo "============================================================"


      # ==========================================================
      # VERIFY NEWS ENGINE OUTPUT
      # ==========================================================

      - name: Verify news engine output
        run: |
          set -e

          echo "============================================================"
          echo "VERIFYING NEWS ENGINE OUTPUT"
          echo "============================================================"

          echo ""
          echo "DATA FILES:"
          find data -maxdepth 1 -type f -print -exec ls -lh {} \; || true

          if [ ! -f data/story.json ]; then
            echo ""
            echo "ERROR: data/story.json was not generated."
            exit 1
          fi

          if [ ! -f data/script.json ]; then
            echo ""
            echo "ERROR: data/script.json was not generated."
            exit 1
          fi

          echo ""
          echo "story.json:"
          ls -lh data/story.json

          echo ""
          echo "script.json:"
          ls -lh data/script.json


      # ==========================================================
      # NORMALIZE STORY + SCRIPT FOR RENDERER
      #
      # Accepts:
      #
      # 1. {"stories": [...]}
      #
      # 2. [{"title": ...}, ...]
      #
      # 3. {"title": ..., "image_path": ...}
      #
      # and converts to:
      #
      # {"stories": [...]}
      # ==========================================================

      - name: Prepare renderer input
        run: |
          set -e

          echo "============================================================"
          echo "NORMALIZING RENDERER INPUT"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("data")

          story_path = data_dir / "story.json"
          script_path = data_dir / "script.json"

          selected_story_path = data_dir / "selected_story.json"
          selected_script_path = data_dir / "selected_script.json"


          def load_json(path):
              with path.open("r", encoding="utf-8") as f:
                  return json.load(f)


          def normalize_stories(data):
              # Already standard structure.
              if isinstance(data, dict):
                  stories = data.get("stories")

                  if isinstance(stories, list):
                      return {
                          "stories": stories
                      }

                  # Some engines use "story".
                  single = data.get("story")

                  if isinstance(single, dict):
                      return {
                          "stories": [single]
                      }

                  # Single story object.
                  if any(
                      key in data
                      for key in (
                          "title",
                          "headline",
                          "description",
                          "summary",
                          "image",
                          "image_path",
                          "images",
                          "source",
                          "county",
                      )
                  ):
                      return {
                          "stories": [data]
                      }

              # Root list.
              if isinstance(data, list):
                  return {
                      "stories": data
                  }

              raise RuntimeError(
                  "Unable to identify stories in story.json."
              )


          def normalize_script(data):
              if isinstance(data, dict):
                  scripts = data.get("scripts")

                  if isinstance(scripts, list):
                      return {
                          "scripts": scripts
                      }

                  script = data.get("script")

                  if isinstance(script, dict):
                      return {
                          "scripts": [script]
                      }

                  if any(
                      key in data
                      for key in (
                          "narration",
                          "text",
                          "script",
                          "title",
                          "story",
                      )
                  ):
                      return {
                          "scripts": [data]
                      }

              if isinstance(data, list):
                  return {
                      "scripts": data
                  }

              # Keep any unknown dictionary structure rather than
              # destroying useful information.
              if isinstance(data, dict):
                  return data

              raise RuntimeError(
                  "Unable to identify script data in script.json."
              )


          story_data = load_json(story_path)
          script_data = load_json(script_path)

          normalized_story = normalize_stories(story_data)
          normalized_script = normalize_script(script_data)

          stories = normalized_story.get("stories", [])

          if not stories:
              raise RuntimeError(
                  "story.json contains zero stories."
              )

          with selected_story_path.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  normalized_story,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with selected_script_path.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  normalized_script,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("Story normalization successful.")
          print("Stories:", len(stories))

          print("")
          print("Story structure:")
          print(type(story_data).__name__)

          print("")
          print("Selected story:")
          print(selected_story_path)

          print("")
          print("Selected script:")
          print(selected_script_path)
          PY

          echo ""
          echo "============================================================"
          echo "NORMALIZED SELECTED STORY"
          echo "============================================================"

          cat data/selected_story.json

          echo ""
          echo "============================================================"
          echo "NORMALIZED SELECTED SCRIPT"
          echo "============================================================"

          cat data/selected_script.json


      # ==========================================================
      # VERIFY REAL STORY PHOTOS
      # ==========================================================

      - name: Verify real story images
        run: |
          set -e

          echo "============================================================"
          echo "VERIFYING REAL STORY IMAGES"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path

          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          BASE_DIR = Path.cwd()
          SOURCE_DIR = BASE_DIR / "assets" / "source"
          STORY_FILE = BASE_DIR / "data" / "selected_story.json"

          MIN_BYTES = 10000
          MIN_WIDTH = 300
          MIN_HEIGHT = 200

          FORBIDDEN_TERMS = [
              "citizen",
              "citizen digital",
              "citizen tv",
              "ctv",
              "world cup",
              "worldcup",
              "avatar",
              "placeholder",
              "default image",
              "generic avatar",
              "profile picture",
          ]


          def normalize_ref(value):
              if isinstance(value, dict):
                  for key in (
                      "local_path",
                      "path",
                      "image_path",
                      "file",
                      "filename",
                      "local_file",
                      "photo_path",
                  ):
                      if value.get(key):
                          return str(value[key])

                  for key in (
                      "url",
                      "image_url",
                      "src",
                      "source",
                  ):
                      if value.get(key):
                          return str(value[key])

                  return ""

              if value is None:
                  return ""

              return str(value)


          def resolve_image(ref):
              ref = normalize_ref(ref).strip()

              if not ref:
                  return None

              ref = ref.replace("\\_", "_")
              ref = ref.replace("\\", "/")

              candidates = []

              path = Path(ref)

              if path.is_absolute():
                  candidates.append(path)

              candidates.append(BASE_DIR / ref)

              clean = ref.lstrip("./")

              candidates.append(BASE_DIR / clean)

              filename = Path(clean).name

              candidates.append(
                  SOURCE_DIR / filename
              )

              seen = set()

              for candidate in candidates:
                  try:
                      key = str(candidate.resolve())
                  except Exception:
                      key = str(candidate)

                  if key in seen:
                      continue

                  seen.add(key)

                  if candidate.is_file():
                      return candidate

              matches = list(
                  SOURCE_DIR.rglob(filename)
              )

              if matches:
                  return matches[0]

              stem = Path(filename).stem

              for candidate in SOURCE_DIR.rglob("*"):
                  if not candidate.is_file():
                      continue

                  if candidate.stem == stem:
                      return candidate

              return None


          def validate_image(path):
              if path is None:
                  return False, "not found"

              if not path.is_file():
                  return False, "not a file"

              size = path.stat().st_size

              if size < MIN_BYTES:
                  return False, f"too small: {size} bytes"

              lower = path.name.lower()

              for term in FORBIDDEN_TERMS:
                  if term in lower:
                      return False, (
                          f"forbidden filename: {term}"
                      )

              try:
                  with Image.open(path) as image:
                      image.load()

                      width, height = image.size

                      if (
                          width < MIN_WIDTH
                          or height < MIN_HEIGHT
                      ):
                          return False, (
                              f"dimensions too small: "
                              f"{width}x{height}"
                          )

                      return True, (
                          f"{width}x{height}, "
                          f"{image.format}"
                      )

              except Exception as exc:
                  return False, (
                      f"Pillow decode failed: {exc}"
                  )


          with STORY_FILE.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          stories = data.get("stories", [])

          if not isinstance(stories, list):
              raise RuntimeError(
                  "Normalized selected_story.json "
                  "does not contain a stories list."
              )

          references = []

          print("")
          print("Stories:", len(stories))

          for index, story in enumerate(
              stories,
              start=1
          ):
              if not isinstance(story, dict):
                  continue

              print("")
              print(f"Story {index}:")
              print(
                  "Title:",
                  story.get("title", "")
              )
              print(
                  "County:",
                  story.get("county", "")
              )
              print(
                  "Source:",
                  story.get("source", "")
              )

              images = story.get("images", [])

              if isinstance(images, list):
                  for item in images:
                      references.append(item)
              elif images:
                  references.append(images)

              for key in (
                  "image_path",
                  "image",
                  "local_image",
                  "photo",
                  "photo_path",
              ):
                  if story.get(key):
                      references.append(
                          story[key]
                      )

          valid = []
          seen = set()

          print("")
          print("============================================================")
          print("CHECKING STORY IMAGE REFERENCES")
          print("============================================================")

          for item in references:
              ref = normalize_ref(item)

              if not ref:
                  continue

              path = resolve_image(ref)

              print("")
              print("Reference:", ref)

              if path:
                  print("Resolved:", path)
              else:
                  print("Resolved: NOT FOUND")

              ok, reason = validate_image(path)

              print(
                  "Status:",
                  "VALID" if ok else "INVALID"
              )

              print(
                  "Details:",
                  reason
              )

              if ok:
                  key = str(path.resolve())

                  if key not in seen:
                      seen.add(key)
                      valid.append(path)

          # Direct fallback for generated story files.
          print("")
          print("============================================================")
          print("CHECKING GENERATED STORY IMAGE FILES")
          print("============================================================")

          for pattern in (
              "story_*_image.*",
              "story_image.*",
          ):
              for path in SOURCE_DIR.glob(pattern):
                  if not path.is_file():
                      continue

                  ok, reason = validate_image(path)

                  print("")
                  print("File:", path)
                  print(
                      "Status:",
                      "VALID" if ok else "INVALID"
                  )
                  print(
                      "Details:",
                      reason
                  )

                  if ok:
                      key = str(path.resolve())

                      if key not in seen:
                          seen.add(key)
                          valid.append(path)

          print("")
          print("============================================================")
          print("REAL STORY IMAGES FOUND:")
          print(len(valid))
          print("============================================================")

          for index, path in enumerate(
              valid,
              start=1
          ):
              print(
                  f"{index}. {path}"
              )

          if not valid:
              print("")
              print("ERROR: No valid real story images found.")

              print("")
              print("ASSETS/SOURCE CONTENT:")

              for path in sorted(
                  SOURCE_DIR.rglob("*")
              ):
                  if path.is_file():
                      print(
                          path,
                          path.stat().st_size,
                          "bytes"
                      )

              raise SystemExit(1)

          print("")
          print("STORY IMAGE VERIFICATION PASSED")
          PY


      # ==========================================================
      # VALIDATE SELECTED STORY STRUCTURE
      # ==========================================================

      - name: Validate selected story structure
        run: |
          set -e

          echo "============================================================"
          echo "VALIDATING SELECTED STORY JSON"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/selected_story.json"
          )

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise RuntimeError(
                  "selected_story.json is not a JSON object."
              )

          stories = data.get("stories")

          if not isinstance(stories, list):
              raise RuntimeError(
                  "selected_story.json normalization failed."
              )

          if not stories:
              raise RuntimeError(
                  "selected_story.json contains zero stories."
              )

          print(
              "Stories:",
              len(stories)
          )

          for index, story in enumerate(
              stories,
              start=1
          ):
              if not isinstance(story, dict):
                  raise RuntimeError(
                      f"Story {index} is not an object."
                  )

              print("")
              print(
                  f"Story {index}:"
              )

              print(
                  "Title:",
                  story.get("title", "")
              )

              print(
                  "County:",
                  story.get("county", "")
              )

              print(
                  "Category:",
                  story.get("category", "")
              )

              print(
                  "Source:",
                  story.get("source", "")
              )

              print(
                  "Currentness:",
                  story.get("currentness", "")
              )

              print(
                  "Image URL:",
                  story.get("image_url", "")
              )

              print(
                  "Image path:",
                  story.get("image_path", "")
              )

              images = story.get(
                  "images",
                  []
              )

              if isinstance(images, list):
                  print(
                      "Image references:",
                      len(images)
                  )

                  for image in images:
                      print(
                          "  -",
                          image
                      )

          print("")
          print(
              "SELECTED STORY JSON VALIDATION PASSED"
          )
          PY


      # ==========================================================
      # RUN VIDEO RENDERER
      # ==========================================================

      - name: Render Rift Valley Watch video
        run: |
          set -e

          echo "============================================================"
          echo "STARTING VIDEO RENDERER"
          echo "============================================================"

          python -u rift_valley_video_generator.py

          echo ""
          echo "============================================================"
          echo "VIDEO RENDERER FINISHED"
          echo "============================================================"


      # ==========================================================
      # VERIFY NARRATION
      # ==========================================================

      - name: Verify narration
        run: |
          set -e

          echo "============================================================"
          echo "VERIFYING NARRATION"
          echo "============================================================"

          AUDIO_FILE=""

          if [ -f audio/narration.mp3 ]; then
            AUDIO_FILE="audio/narration.mp3"
          elif [ -f assets/video_work/narration.mp3 ]; then
            AUDIO_FILE="assets/video_work/narration.mp3"
          fi

          if [ -z "$AUDIO_FILE" ]; then
            echo ""
            echo "ERROR: Narration MP3 was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$AUDIO_FILE")

          echo ""
          echo "Narration:"
          echo "$AUDIO_FILE"

          echo ""
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo ""
            echo "ERROR: Narration is too small."
            exit 1
          fi

          echo ""
          echo "FFprobe:"

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,codec_type,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$AUDIO_FILE"

          echo ""
          echo "NARRATION VERIFICATION PASSED"


      # ==========================================================
      # CHECK FOR FORBIDDEN VISUALS
      # ==========================================================

      - name: Check downloaded image filenames
        run: |
          set -e

          echo "============================================================"
          echo "CHECKING FOR FORBIDDEN IMAGE FILENAMES"
          echo "============================================================"

          if find assets/source -type f | grep -Ei \
            "citizen|ctv|world.?cup|avatar|placeholder|default.?image|generic.?avatar|profile.?picture"; then

            echo ""
            echo "ERROR: Forbidden/generic image detected."
            exit 1
          fi

          echo ""
          echo "No forbidden/generic image filenames detected."


      # ==========================================================
      # VERIFY FINAL MP4
      # ==========================================================

      - name: Verify final MP4
        run: |
          set -e

          FILE="output/rift_valley_watch_reel.mp4"

          echo "============================================================"
          echo "VERIFYING FINAL MP4"
          echo "============================================================"

          if [ ! -f "$FILE" ]; then
            echo ""
            echo "ERROR: Final MP4 was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")

          echo ""
          echo "File:"
          echo "$FILE"

          echo ""
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo ""
            echo "ERROR: MP4 is too small."
            exit 1
          fi

          WIDTH=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$FILE")

          HEIGHT=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$FILE")

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of csv=p=0 \
            "$FILE")

          HAS_AUDIO=$(ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_type \
            -of csv=p=0 \
            "$FILE")

          VIDEO_CODEC=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$FILE")

          AUDIO_CODEC=$(ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$FILE")

          echo ""
          echo "Width:"
          echo "$WIDTH"

          echo ""
          echo "Height:"
          echo "$HEIGHT"

          echo ""
          echo "Duration:"
          echo "$DURATION seconds"

          echo ""
          echo "Video codec:"
          echo "$VIDEO_CODEC"

          echo ""
          echo "Audio codec:"
          echo "$AUDIO_CODEC"

          if [ "$WIDTH" != "1080" ]; then
            echo ""
            echo "ERROR: Width is not 1080."
            exit 1
          fi

          if [ "$HEIGHT" != "1920" ]; then
            echo ""
            echo "ERROR: Height is not 1920."
            exit 1
          fi

          if [ -z "$HAS_AUDIO" ]; then
            echo ""
            echo "ERROR: Final video has no audio."
            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "FINAL MP4 VERIFICATION PASSED"
          echo "============================================================"


      # ==========================================================
      # SHOW GENERATED FILES
      # ==========================================================

      - name: Show generated files
        if: always()
        run: |
          echo "============================================================"
          echo "GENERATED FILES"
          echo "============================================================"

          echo ""
          echo "OUTPUT:"
          find output -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "AUDIO:"
          find audio -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "SOURCE IMAGES:"
          find assets/source -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "VIDEO WORK:"
          find assets/video_work -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "DATA:"
          find data -type f -print -exec ls -lh {} \; || true


      # ==========================================================
      # UPLOAD MP4 AS GITHUB ARTIFACT
      # ==========================================================

      - name: Upload generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-video
          path: output/rift_valley_watch_reel.mp4
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # COMMIT FINAL MP4
      # ==========================================================

      - name: Commit generated MP4
        run: |
          set -e

          echo "============================================================"
          echo "COMMITTING GENERATED MP4"
          echo "============================================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/rift_valley_watch_reel.mp4

          if git diff --cached --quiet; then
            echo "No MP4 changes to commit."
          else
            git commit -m "Generate Rift Valley Watch video"
            git push
          fi


      # ==========================================================
      # FINAL STATUS
      # ==========================================================

      - name: Final status
        run: |
          echo ""
          echo "============================================================"
          echo "RIFT VALLEY WATCH GENERATION SUCCESSFUL"
          echo "============================================================"
          echo ""

          echo "News engine:"
          echo "data/story.json"
          echo "data/script.json"

          echo ""
          echo "Renderer input:"
          echo "data/selected_story.json"
          echo "data/selected_script.json"

          echo ""
          echo "Final MP4:"
          echo "output/rift_valley_watch_reel.mp4"

          echo ""
          echo "GitHub Artifact:"
          echo "rift-valley-watch-video"

          echo ""
          echo "============================================================"
