name: Rift Valley Watch V2 Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow gTTS

      - name: Check project files
        run: |
          echo "=========================================="
          echo "CHECKING PROJECT"
          echo "=========================================="

          test -f data/story.json
          test -f data/script.json
          test -f scripts/news_engine.py
          test -f scripts/video_generator.py

          echo "Project files OK"

      - name: Prepare directories
        run: |
          mkdir -p output
          mkdir -p output/scenes
          mkdir -p output/audio
          mkdir -p assets
          mkdir -p assets/source
          mkdir -p assets/audio
          mkdir -p assets/music

      - name: Generate real-time news
        run: |
          echo "=========================================="
          echo "GENERATING REAL-TIME RIFT VALLEY NEWS"
          echo "=========================================="

          python -u scripts/news_engine.py

      - name: Show generated news
        run: |
          echo "=========================================="
          echo "STORY.JSON"
          echo "=========================================="

          cat data/story.json

          echo
          echo "=========================================="
          echo "SCRIPT.JSON"
          echo "=========================================="

          cat data/script.json

      - name: Generate video
        run: |
          echo "=========================================="
          echo "STARTING VIDEO GENERATOR"
          echo "=========================================="

          set +e

          python -u scripts/video_generator.py 2>&1 | tee video_generator.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "=========================================="
          echo "VIDEO GENERATOR EXIT CODE: $STATUS"
          echo "=========================================="

          exit $STATUS

      - name: Print complete generator log
        if: always()
        run: |
          echo "=========================================="
          echo "COMPLETE VIDEO GENERATOR LOG"
          echo "=========================================="

          if [ -f video_generator.log ]; then
            cat video_generator.log
          else
            echo "video_generator.log was not created"
          fi

      - name: Inspect generated scenes
        if: always()
        run: |
          echo "=========================================="
          echo "OUTPUT DIRECTORY"
          echo "=========================================="

          find output -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true

          echo
          echo "=========================================="
          echo "SCENE FILES"
          echo "=========================================="

          ls -lah output/scenes/ 2>/dev/null || true

      - name: Verify MP4 exists
        run: |
          echo "=========================================="
          echo "VERIFYING FINAL MP4"
          echo "=========================================="

          if [ ! -f output/rift_valley_watch.mp4 ]; then
            echo
            echo "ERROR: Final MP4 was not created."
            echo
            echo "Last 150 lines of generator log:"
            tail -n 150 video_generator.log || true
            echo
            echo "Generated files:"
            find output -maxdepth 3 -type f -printf '%p %s bytes\n' || true
            exit 1
          fi

          ls -lh output/rift_valley_watch.mp4

      - name: Inspect MP4
        if: success()
        run: |
          echo "=========================================="
          echo "FFPROBE"
          echo "=========================================="

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of json \
            output/rift_valley_watch.mp4

      - name: Upload MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-v2-mp4
          path: output/rift_valley_watch.mp4
          if-no-files-found: error

      - name: Upload generated script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-v2-script
          path: |
            data/story.json
            data/script.json
            data/visual_report.json
          if-no-files-found: warn

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-generator-log
          path: video_generator.log
          if-no-files-found: warn

      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-debug-output
          path: output/
          if-no-files-found: warn
