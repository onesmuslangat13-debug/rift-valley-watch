name: Rift Valley Watch - Generate Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # FFMPEG
      # ============================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ============================================================
      # PYTHON PACKAGES
      # ============================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 gTTS Pillow moviepy numpy

      # ============================================================
      # CLEAN OLD GENERATED FILES
      # ============================================================
      - name: Clean previous generated files
        run: |
          rm -f output/rift_valley_watch_reel.mp4
          rm -f audio/narration.mp3
          rm -f assets/video_work/narration.mp3
          rm -f assets/source/story_image.jpg
          rm -f data/selected_story.json
          rm -f data/selected_script.json

          mkdir -p output
          mkdir -p audio
          mkdir -p assets/source
          mkdir -p assets/video_work
          mkdir -p data

      # ============================================================
      # GENERATE THE RIFT VALLEY WATCH VIDEO
      # ============================================================
      - name: Generate Rift Valley Watch video
        run: |
          python -u rift_valley_main.py

      # ============================================================
      # VERIFY NARRATION
      # ============================================================
      - name: Verify narration
        run: |
          echo "============================================================"
          echo "VERIFYING NARRATION"
          echo "============================================================"

          if [ -f "audio/narration.mp3" ]; then
            AUDIO_FILE="audio/narration.mp3"
          elif [ -f "assets/video_work/narration.mp3" ]; then
            AUDIO_FILE="assets/video_work/narration.mp3"
          else
            echo "ERROR: Narration MP3 was not generated."
            echo ""
            echo "Available audio files:"
            find . -type f \( -name "*.mp3" -o -name "*.wav" -o -name "*.m4a" \) -print || true
            exit 1
          fi

          AUDIO_SIZE=$(stat -c%s "$AUDIO_FILE")

          echo "Narration found:"
          echo "$AUDIO_FILE"
          echo "Size: $AUDIO_SIZE bytes"

          if [ "$AUDIO_SIZE" -lt 1000 ]; then
            echo "ERROR: Narration file is too small."
            exit 1
          fi

          echo "Narration verification successful."

      # ============================================================
      # VERIFY STORY IMAGE
      # ============================================================
      - name: Verify story image
        run: |
          echo "============================================================"
          echo "VERIFYING STORY IMAGE"
          echo "============================================================"

          if [ ! -f "assets/source/story_image.jpg" ]; then
            echo "ERROR: Story image was not generated."
            exit 1
          fi

          IMAGE_SIZE=$(stat -c%s "assets/source/story_image.jpg")

          echo "Story image:"
          echo "assets/source/story_image.jpg"
          echo "Size: $IMAGE_SIZE bytes"

          if [ "$IMAGE_SIZE" -lt 10000 ]; then
            echo "ERROR: Story image is suspiciously small."
            exit 1
          fi

          echo "Story image verification successful."

      # ============================================================
      # VERIFY FINAL MP4
      # ============================================================
      - name: Verify final MP4
        run: |
          echo "============================================================"
          echo "VERIFYING FINAL MP4"
          echo "============================================================"

          FILE="output/rift_valley_watch_reel.mp4"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Rift Valley Watch MP4 was NOT generated."
            echo ""
            echo "Available MP4 files:"
            find . -type f -name "*.mp4" -print || true
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$FILE")

          echo "MP4:"
          echo "$FILE"
          echo "Size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: MP4 is too small."
            exit 1
          fi

          echo ""
          echo "FFprobe information:"
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_type,width,height \
            -of default=noprint_wrappers=1 \
            "$FILE"

          WIDTH=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$FILE")

          HEIGHT=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$FILE")

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of csv=p=0 \
            "$FILE")

          HAS_AUDIO=$(ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_type \
            -of csv=p=0 \
            "$FILE")

          echo ""
          echo "Width: $WIDTH"
          echo "Height: $HEIGHT"
          echo "Duration: $DURATION seconds"
          echo "Audio: $HAS_AUDIO"

          if [ "$WIDTH" != "1080" ]; then
            echo "ERROR: Video width is not 1080."
            exit 1
          fi

          if [ "$HEIGHT" != "1920" ]; then
            echo "ERROR: Video height is not 1920."
            exit 1
          fi

          if [ -z "$HAS_AUDIO" ]; then
            echo "ERROR: Video has no audio."
            exit 1
          fi

          echo ""
          echo "FINAL MP4 VERIFICATION SUCCESSFUL."

      # ============================================================
      # SHOW GENERATED FILES
      # ============================================================
      - name: Show generated files
        run: |
          echo "============================================================"
          echo "GENERATED FILES"
          echo "============================================================"

          echo ""
          echo "OUTPUT:"
          find output -maxdepth 2 -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "AUDIO:"
          find audio -maxdepth 2 -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "STORY IMAGE:"
          find assets/source -maxdepth 2 -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "DATA:"
          find data -maxdepth 2 -type f -print -exec ls -lh {} \; || true

      # ============================================================
      # UPLOAD MP4 AS GITHUB ACTIONS ARTIFACT
      # ============================================================
      - name: Upload generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-video
          path: output/rift_valley_watch_reel.mp4
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # COMMIT MP4 TO REPOSITORY
      # ============================================================
      - name: Commit generated MP4 to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/rift_valley_watch_reel.mp4

          if git diff --cached --quiet; then
            echo "No MP4 changes to commit."
          else
            git commit -m "Generate Rift Valley Watch video"
            git push
          fi

      # ============================================================
      # FINAL SUCCESS MESSAGE
      # ============================================================
      - name: Final status
        run: |
          echo ""
          echo "============================================================"
          echo "RIFT VALLEY WATCH GENERATION SUCCESSFUL"
          echo "============================================================"
          echo ""
          echo "MP4:"
          echo "output/rift_valley_watch_reel.mp4"
          echo ""
          echo "GitHub Actions artifact:"
          echo "rift-valley-watch-video"
          echo ""
          echo "The MP4 is now available in TWO places:"
          echo ""
          echo "1. Repository:"
          echo "   output/rift_valley_watch_reel.mp4"
          echo ""
          echo "2. Actions:"
          echo "   Artifacts -> rift-valley-watch-video"
          echo ""
          echo "============================================================"
