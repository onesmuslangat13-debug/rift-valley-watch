name: Rift Valley Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # 3. FFMPEG
      # ============================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "============================================================"
          echo "FFMPEG VERSION"
          echo "============================================================"

          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2

      # ============================================================
      # 4. PYTHON DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            requests \
            feedparser \
            beautifulsoup4 \
            gTTS \
            Pillow \
            moviepy \
            numpy

      # ============================================================
      # 5. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare directories
        run: |
          mkdir -p output
          mkdir -p data
          mkdir -p audio
          mkdir -p assets
          mkdir -p assets/source
          mkdir -p assets/audio

          echo "============================================================"
          echo "DIRECTORIES"
          echo "============================================================"

          find . -maxdepth 3 -type d | sort

      # ============================================================
      # 6. CHECK PROJECT FILES
      # ============================================================
      - name: Check project files
        run: |
          echo "============================================================"
          echo "PROJECT ROOT"
          echo "============================================================"

          pwd
          ls -lah

          echo ""
          echo "============================================================"
          echo "PYTHON FILES"
          echo "============================================================"

          find . -maxdepth 4 -type f -name "*.py" -print | sort

          echo ""
          echo "============================================================"
          echo "WORKFLOW FILES"
          echo "============================================================"

          find .github -maxdepth 3 -type f -print 2>/dev/null || true

      # ============================================================
      # 7. VERIFY REQUIRED FILES
      # ============================================================
      - name: Verify required Python files
        run: |
          echo "============================================================"
          echo "VERIFYING REQUIRED FILES"
          echo "============================================================"

          if [ ! -f "rift_valley_main.py" ]; then
            echo "::error::rift_valley_main.py was not found."
            exit 1
          fi

          if [ ! -f "rift_valley_video_generator.py" ]; then
            echo "::error::rift_valley_video_generator.py was not found."
            exit 1
          fi

          echo "rift_valley_main.py FOUND"
          ls -lh rift_valley_main.py

          echo ""
          echo "rift_valley_video_generator.py FOUND"
          ls -lh rift_valley_video_generator.py

      # ============================================================
      # 8. RUN NEWS ENGINE
      # ============================================================
      - name: Generate verified county story
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "============================================================"
          echo "RIFT VALLEY WATCH - NEWS ENGINE"
          echo "============================================================"

          python --version

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Running:"
          echo "python -u rift_valley_main.py"
          echo ""

          python -u rift_valley_main.py

          echo ""
          echo "============================================================"
          echo "NEWS ENGINE COMPLETED"
          echo "============================================================"

          echo ""
          echo "DATA FILES:"
          ls -lah data || true

          echo ""
          echo "SOURCE ASSETS:"
          find assets -maxdepth 3 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      # ============================================================
      # 9. VERIFY STORY DATA
      # ============================================================
      - name: Verify selected story
        run: |
          echo "============================================================"
          echo "VERIFYING STORY DATA"
          echo "============================================================"

          if [ ! -f "data/selected_story.json" ]; then
            echo "::error::selected_story.json was not generated."
            exit 1
          fi

          if [ ! -f "data/selected_script.json" ]; then
            echo "::error::selected_script.json was not generated."
            exit 1
          fi

          echo ""
          echo "SELECTED STORY:"
          cat data/selected_story.json

          echo ""
          echo "SELECTED SCRIPT:"
          cat data/selected_script.json

      # ============================================================
      # 10. VERIFY REAL LOCAL IMAGE
      # ============================================================
      - name: Verify article image
        run: |
          echo "============================================================"
          echo "VERIFYING ARTICLE IMAGE"
          echo "============================================================"

          IMAGE="assets/source/story_image.jpg"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Real article image was not generated."
            echo ""
            echo "Available images:"
            find assets -type f \
              \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
              -print || true
            exit 1
          fi

          SIZE=$(stat -c%s "$IMAGE")

          echo "Image:"
          ls -lh "$IMAGE"

          echo "Image size: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Article image is suspiciously small."
            exit 1
          fi

          python - <<'PY'
          from PIL import Image

          path = "assets/source/story_image.jpg"

          with Image.open(path) as image:
              print("Image format:", image.format)
              print("Image size:", image.size)
              print("Image mode:", image.mode)

              if image.width < 300 or image.height < 200:
                  raise SystemExit(
                      "Article image resolution is too small."
                  )

          print("ARTICLE IMAGE CHECK PASSED")
          PY

      # ============================================================
      # 11. RUN VIDEO GENERATOR EXPLICITLY
      # ============================================================
      - name: Generate Rift Valley Watch MP4
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "============================================================"
          echo "RIFT VALLEY WATCH - VIDEO GENERATOR"
          echo "============================================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Video generator:"
          ls -lh rift_valley_video_generator.py

          echo ""
          echo "Story:"
          ls -lh data/selected_story.json

          echo ""
          echo "Script:"
          ls -lh data/selected_script.json

          echo ""
          echo "Local article image:"
          ls -lh assets/source/story_image.jpg

          echo ""
          echo "============================================================"
          echo "STARTING VIDEO GENERATOR"
          echo "============================================================"

          python -u rift_valley_video_generator.py

          echo ""
          echo "============================================================"
          echo "VIDEO GENERATOR COMPLETED"
          echo "============================================================"

          echo ""
          echo "OUTPUT:"
          ls -lah output || true

          echo ""
          echo "MP4 FILES:"
          find . -type f -iname "*.mp4" -print -exec ls -lh {} \; || true

      # ============================================================
      # 12. POST-GENERATION INSPECTION
      # ============================================================
      - name: Inspect generated files
        if: always()
        run: |
          echo "============================================================"
          echo "POST-GENERATION INSPECTION"
          echo "============================================================"

          echo ""
          echo "OUTPUT:"
          ls -lah output || true

          echo ""
          echo "DATA:"
          ls -lah data || true

          echo ""
          echo "AUDIO:"
          ls -lah audio || true

          echo ""
          echo "ASSETS:"
          find assets -maxdepth 3 -type f -print -exec ls -lh {} \; 2>/dev/null || true

          echo ""
          echo "ALL MP4:"
          find . -type f -iname "*.mp4" -print -exec ls -lh {} \; || true

          echo ""
          echo "ALL MP3:"
          find . -type f -iname "*.mp3" -print -exec ls -lh {} \; || true

      # ============================================================
      # 13. SHOW SELECTED STORY
      # ============================================================
      - name: Show selected story
        if: always()
        run: |
          echo "============================================================"
          echo "SELECTED STORY"
          echo "============================================================"

          if [ -f "data/selected_story.json" ]; then
            cat data/selected_story.json
          else
            echo "selected_story.json does not exist"
          fi

      # ============================================================
      # 14. SHOW SCRIPT
      # ============================================================
      - name: Show selected script
        if: always()
        run: |
          echo "============================================================"
          echo "SELECTED SCRIPT"
          echo "============================================================"

          if [ -f "data/selected_script.json" ]; then
            cat data/selected_script.json
          else
            echo "selected_script.json does not exist"
          fi

      # ============================================================
      # 15. VERIFY FINAL MP4
      # ============================================================
      - name: Verify Rift Valley Watch MP4
        run: |
          FILE="output/rift_valley_watch_reel.mp4"

          echo "============================================================"
          echo "VERIFYING FINAL MP4"
          echo "============================================================"

          if [ ! -f "$FILE" ]; then
            echo "::error::Rift Valley Watch MP4 was NOT generated."

            echo ""
            echo "Available MP4 files:"
            find . -type f -iname "*.mp4" -print || true

            echo ""
            echo "Output directory:"
            ls -lah output || true

            echo ""
            echo "Audio directory:"
            ls -lah audio || true

            echo ""
            echo "Assets directory:"
            find assets -maxdepth 3 -type f -print || true

            exit 1
          fi

          echo ""
          echo "SUCCESS!"
          echo "Video found:"
          ls -lh "$FILE"

      # ============================================================
      # 16. VERIFY FILE SIZE
      # ============================================================
      - name: Verify MP4 size
        run: |
          FILE="output/rift_valley_watch_reel.mp4"

          SIZE=$(stat -c%s "$FILE")

          echo "Video size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::Video is suspiciously small."
            exit 1
          fi

          echo "VIDEO SIZE CHECK PASSED"

      # ============================================================
      # 17. FFPROBE
      # ============================================================
      - name: Verify video with FFprobe
        run: |
          FILE="output/rift_valley_watch_reel.mp4"

          echo "============================================================"
          echo "FFPROBE VIDEO CHECK"
          echo "============================================================"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate,codec_type \
            -of default=noprint_wrappers=1 \
            "$FILE"

      # ============================================================
      # 18. FINAL DIRECTORY
      # ============================================================
      - name: Final output confirmation
        run: |
          echo "============================================================"
          echo "RIFT VALLEY WATCH COMPLETE"
          echo "============================================================"

          echo ""
          echo "FINAL MP4:"
          ls -lh output/rift_valley_watch_reel.mp4

          echo ""
          echo "FINAL OUTPUT DIRECTORY:"
          ls -lah output

      # ============================================================
      # 19. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Rift Valley Watch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-output
          path: |
            output/
            data/
            audio/
            assets/source/
          if-no-files-found: warn
          retention-days: 14
