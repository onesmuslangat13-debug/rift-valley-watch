name: Rift Valley Watch - Generate Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python packages
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            requests \
            feedparser \
            beautifulsoup4 \
            gTTS \
            Pillow \
            moviepy \
            numpy

      - name: Test gTTS
        run: |
          set -e

          mkdir -p audio

          python - <<'PY'
          from pathlib import Path
          from gtts import gTTS

          output = Path("audio/gtts_test.mp3")

          tts = gTTS(
              text="Rift Valley Watch narration test.",
              lang="en",
              slow=False
          )

          tts.save(str(output))

          if not output.exists():
              raise RuntimeError("gTTS test failed.")

          if output.stat().st_size < 1000:
              raise RuntimeError("gTTS output is too small.")

          print("gTTS TEST SUCCESSFUL")
          PY

          rm -f audio/gtts_test.mp3

      - name: Inspect repository renderer
        run: |
          set -e

          echo "============================================================"
          echo "ACTUAL RENDERER IN GITHUB RUNNER"
          echo "============================================================"

          pwd

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Renderer:"
          ls -lh rift_valley_video_generator.py

          echo ""
          echo "Renderer line count:"
          wc -l rift_valley_video_generator.py

          echo ""
          echo "Renderer first 20 lines:"
          sed -n '1,20p' rift_valley_video_generator.py

          echo ""
          echo "Renderer last 20 lines:"
          tail -n 20 rift_valley_video_generator.py

          echo ""
          echo "Checking for old broken renderer..."

          if grep -n "y_top = (" rift_valley_video_generator.py; then
            echo ""
            echo "============================================================"
            echo "FATAL ERROR"
            echo "============================================================"
            echo ""
            echo "The OLD BROKEN renderer is still committed to GitHub."
            echo ""
            echo "This workflow intentionally stopped before py_compile."
            echo ""
            exit 1
          fi

          echo ""
          echo "OLD BROKEN y_top CODE NOT FOUND."

          echo ""
          echo "Checking for fixed-five-scene code..."

          if grep -n "SCENE_COUNT = 5" rift_valley_video_generator.py; then
            echo ""
            echo "FATAL ERROR: Old fixed-five-scene renderer detected."
            exit 1
          fi

          echo ""
          echo "OLD FIXED-FIVE-SCENE CODE NOT FOUND."

      - name: Clean generated files
        run: |
          set -e

          rm -f output/rift_valley_watch_reel.mp4

          rm -f audio/narration.mp3
          rm -f audio/narration_temp.mp3

          rm -f assets/video_work/narration.mp3

          rm -f assets/source/story_image.jpg
          rm -f assets/source/story_image_*.jpg
          rm -f assets/source/story_image_*.jpeg
          rm -f assets/source/story_image_*.png
          rm -f assets/source/story_image_*.webp

          rm -f data/selected_story.json
          rm -f data/selected_script.json

          mkdir -p output
          mkdir -p audio
          mkdir -p assets/source
          mkdir -p assets/video_work
          mkdir -p data

      - name: Check Python syntax
        run: |
          set -e

          echo "============================================================"
          echo "CHECKING PYTHON SYNTAX"
          echo "============================================================"

          echo ""
          echo "Main:"
          python -m py_compile rift_valley_main.py

          echo ""
          echo "Renderer:"
          python -m py_compile rift_valley_video_generator.py

          echo ""
          echo "============================================================"
          echo "PYTHON SYNTAX CHECK PASSED"
          echo "============================================================"

      - name: Generate Rift Valley Watch video
        run: |
          set -e

          echo "============================================================"
          echo "STARTING RIFT VALLEY WATCH"
          echo "============================================================"

          python -u rift_valley_main.py

      - name: Verify selected story
        run: |
          set -e

          test -f data/selected_story.json

          echo "============================================================"
          echo "SELECTED STORY"
          echo "============================================================"

          cat data/selected_story.json

      - name: Verify selected script
        run: |
          set -e

          test -f data/selected_script.json

          echo "============================================================"
          echo "SELECTED SCRIPT"
          echo "============================================================"

          cat data/selected_script.json

      - name: Verify narration
        run: |
          set -e

          AUDIO_FILE=""

          if [ -f audio/narration.mp3 ]; then
            AUDIO_FILE="audio/narration.mp3"
          elif [ -f assets/video_work/narration.mp3 ]; then
            AUDIO_FILE="assets/video_work/narration.mp3"
          fi

          if [ -z "$AUDIO_FILE" ]; then
            echo "ERROR: Narration MP3 was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$AUDIO_FILE")

          echo "Narration: $AUDIO_FILE"
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: Narration is too small."
            exit 1
          fi

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,codec_type,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$AUDIO_FILE"

      - name: Verify story images
        run: |
          set -e

          echo "============================================================"
          echo "VERIFYING STORY IMAGES"
          echo "============================================================"

          COUNT=0

          for IMAGE in assets/source/story_image*.jpg \
                       assets/source/story_image*.jpeg \
                       assets/source/story_image*.png \
                       assets/source/story_image*.webp; do

            if [ -f "$IMAGE" ]; then
              COUNT=$((COUNT + 1))

              SIZE=$(stat -c%s "$IMAGE")

              echo ""
              echo "Image $COUNT:"
              echo "$IMAGE"
              echo "Size: $SIZE bytes"

              if [ "$SIZE" -lt 10000 ]; then
                echo "ERROR: Image is too small."
                exit 1
              fi
            fi
          done

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No story images found."
            exit 1
          fi

          echo ""
          echo "Story images found: $COUNT"

      - name: Verify final MP4
        run: |
          set -e

          FILE="output/rift_valley_watch_reel.mp4"

          echo "============================================================"
          echo "VERIFYING FINAL MP4"
          echo "============================================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Final MP4 was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")

          echo "File: $FILE"
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: MP4 is too small."
            exit 1
          fi

          WIDTH=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$FILE")

          HEIGHT=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$FILE")

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of csv=p=0 \
            "$FILE")

          HAS_AUDIO=$(ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_type \
            -of csv=p=0 \
            "$FILE")

          VIDEO_CODEC=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$FILE")

          AUDIO_CODEC=$(ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$FILE")

          echo ""
          echo "Width: $WIDTH"
          echo "Height: $HEIGHT"
          echo "Duration: $DURATION"
          echo "Video codec: $VIDEO_CODEC"
          echo "Audio codec: $AUDIO_CODEC"

          if [ "$WIDTH" != "1080" ]; then
            echo "ERROR: Width is not 1080."
            exit 1
          fi

          if [ "$HEIGHT" != "1920" ]; then
            echo "ERROR: Height is not 1920."
            exit 1
          fi

          if [ -z "$HAS_AUDIO" ]; then
            echo "ERROR: Final video has no audio."
            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "FINAL MP4 VERIFICATION PASSED"
          echo "============================================================"

      - name: Show generated files
        if: always()
        run: |
          echo "============================================================"
          echo "GENERATED FILES"
          echo "============================================================"

          echo ""
          echo "OUTPUT:"
          find output -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "AUDIO:"
          find audio -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "SOURCE IMAGES:"
          find assets/source -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "VIDEO WORK:"
          find assets/video_work -type f -print -exec ls -lh {} \; || true

          echo ""
          echo "DATA:"
          find data -type f -print -exec ls -lh {} \; || true

      - name: Upload generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-video
          path: output/rift_valley_watch_reel.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated MP4
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/rift_valley_watch_reel.mp4

          if git diff --cached --quiet; then
            echo "No MP4 changes to commit."
          else
            git commit -m "Generate Rift Valley Watch video"
            git push
          fi

      - name: Final status
        run: |
          echo ""
          echo "============================================================"
          echo "RIFT VALLEY WATCH GENERATION SUCCESSFUL"
          echo "============================================================"
          echo ""
          echo "MP4:"
          echo "output/rift_valley_watch_reel.mp4"
          echo ""
          echo "Artifact:"
          echo "rift-valley-watch-video"
          echo ""
          echo "============================================================"
