name: Rift Valley Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # 3. FFMPEG
      # ============================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg:"
          ffmpeg -version | head -n 2

      # ============================================================
      # 4. PYTHON DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            feedparser \
            beautifulsoup4 \
            gTTS \
            Pillow \
            moviepy \
            numpy

      # ============================================================
      # 5. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare directories
        run: |
          mkdir -p output
          mkdir -p data
          mkdir -p audio
          mkdir -p assets

          echo "Directories:"
          find . -maxdepth 2 -type d | sort

      # ============================================================
      # 6. CHECK PROJECT
      # ============================================================
      - name: Check project files
        run: |
          echo "============================================================"
          echo "ROOT"
          echo "============================================================"
          ls -lah

          echo ""
          echo "============================================================"
          echo "PYTHON FILES"
          echo "============================================================"
          find . -maxdepth 4 -type f -name "*.py" -print

          echo ""
          echo "============================================================"
          echo "OUTPUT"
          echo "============================================================"
          ls -lah output || true

      # ============================================================
      # 7. CHECK MAIN FILE
      # ============================================================
      - name: Check Rift Valley main file
        run: |
          if [ ! -f "rift_valley_main.py" ]; then
            echo "::error::rift_valley_main.py was not found in repository root."
            echo ""
            echo "Python files found:"
            find . -type f -name "*.py" -print
            exit 1
          fi

          echo "Found rift_valley_main.py"
          ls -lh rift_valley_main.py

      # ============================================================
      # 8. RUN RIFT VALLEY WATCH
      # ============================================================
      - name: Generate Rift Valley Watch video
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "============================================================"
          echo "STARTING RIFT VALLEY WATCH"
          echo "============================================================"

          echo ""
          echo "Python version:"
          python --version

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Files:"
          ls -lah

          echo ""
          echo "============================================================"
          echo "RUNNING MAIN SCRIPT"
          echo "============================================================"

          python -u rift_valley_main.py

          EXIT_CODE=$?

          echo ""
          echo "============================================================"
          echo "PYTHON EXIT CODE: $EXIT_CODE"
          echo "============================================================"

          echo ""
          echo "Output after Python:"
          ls -lah output || true

          echo ""
          echo "All MP4 files:"
          find . -type f -iname "*.mp4" -print || true

          exit $EXIT_CODE

      # ============================================================
      # 9. ALWAYS INSPECT FILES
      # ============================================================
      - name: Inspect generated files
        if: always()
        run: |
          echo "============================================================"
          echo "POST-GENERATION FILE INSPECTION"
          echo "============================================================"

          echo ""
          echo "OUTPUT:"
          ls -lah output || true

          echo ""
          echo "DATA:"
          ls -lah data || true

          echo ""
          echo "AUDIO:"
          ls -lah audio || true

          echo ""
          echo "ALL MP4:"
          find . -type f -iname "*.mp4" -print -exec ls -lh {} \; || true

          echo ""
          echo "ALL WAV:"
          find . -type f -iname "*.wav" -print || true

          echo ""
          echo "ALL MP3:"
          find . -type f -iname "*.mp3" -print || true

      # ============================================================
      # 10. SHOW STORY
      # ============================================================
      - name: Show selected story
        if: always()
        run: |
          echo "============================================================"
          echo "STORY JSON"
          echo "============================================================"

          if [ -f "data/story.json" ]; then
            cat data/story.json
          else
            echo "data/story.json DOES NOT EXIST"
          fi

      # ============================================================
      # 11. SHOW SCRIPT
      # ============================================================
      - name: Show generated script
        if: always()
        run: |
          echo "============================================================"
          echo "SCRIPT JSON"
          echo "============================================================"

          if [ -f "data/script.json" ]; then
            cat data/script.json
          else
            echo "data/script.json DOES NOT EXIST"
          fi

      # ============================================================
      # 12. VERIFY MP4
      # ============================================================
      - name: Verify Rift Valley Watch MP4
        run: |
          FILE="output/rift_valley_watch_reel.mp4"

          echo "============================================================"
          echo "VERIFYING FINAL MP4"
          echo "============================================================"

          if [ ! -f "$FILE" ]; then
            echo "::error::Rift Valley Watch MP4 was NOT generated."

            echo ""
            echo "Available MP4 files:"
            find . -type f -iname "*.mp4" -print || true

            echo ""
            echo "Output directory:"
            ls -lah output || true

            echo ""
            echo "Data directory:"
            ls -lah data || true

            exit 1
          fi

          echo "SUCCESS!"
          echo "Video found:"
          ls -lh "$FILE"

      # ============================================================
      # 13. CHECK FILE SIZE
      # ============================================================
      - name: Verify MP4 size
        run: |
          FILE="output/rift_valley_watch_reel.mp4"

          SIZE=$(stat -c%s "$FILE")

          echo "Video size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::Video is suspiciously small."
            exit 1
          fi

          echo "Video size check passed."

      # ============================================================
      # 14. CHECK VIDEO WITH FFPROBE
      # ============================================================
      - name: Verify video with FFprobe
        run: |
          FILE="output/rift_valley_watch_reel.mp4"

          echo "============================================================"
          echo "FFPROBE VIDEO CHECK"
          echo "============================================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$FILE"

      # ============================================================
      # 15. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Rift Valley Watch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-output
          path: |
            output/
            data/
            audio/
          if-no-files-found: warn
          retention-days: 14
