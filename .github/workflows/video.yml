name: Rift Valley Watch — Generate MP4

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow gTTS

      - name: Generate Rift Valley Watch video
        run: |
          python rift_valley_main.py

      - name: Final MP4 QC
        run: |
          test -f output/rift_valley_watch_reel.mp4

          echo "=== VIDEO QC ==="

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,duration \
            -of default=noprint_wrappers=1 \
            output/rift_valley_watch_reel.mp4

          echo "=== AUDIO QC ==="

          ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            output/rift_valley_watch_reel.mp4

          echo "=== FILE QC ==="

          ls -lh output/rift_valley_watch_reel.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-mp4
          path: output/rift_valley_watch_reel.mp4
          if-no-files-found: error
          retention-days: 7
