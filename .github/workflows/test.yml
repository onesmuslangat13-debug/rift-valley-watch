name: Rift Valley Watch Test

on:
  workflow_dispatch:

jobs:
  test-news-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run news engine
        run: |
          python scripts/news_engine.py

      - name: Show generated script
        run: |
          cat data/script.json

      - name: Upload generated script
        uses: actions/upload-artifact@v4
        with:
          name: rift-valley-watch-script
          path: data/script.json
